<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blurry Map</title>
    <link rel="icon" type="image/png" href="../../images/BR_favicon.png" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Rotate Plugin for map rotation -->
    <script src="https://unpkg.com/@mapbox/leaflet-rotate@0.1.0/dist/leaflet-rotate.js"></script>
    <link rel="stylesheet" href="../../styles/hit-counter.css">
</head>
<body>
    <header style="margin-bottom: 20px; display: flex; justify-content: center; font-size: xx-large;">
        <a href="../../../index.html" class="homeLink" aria-label="The Blurry Report Home">
          <h1>THE BLURRY REPORT</h1>
        </a>
      </header>
    <!-- Container for the map -->
    <div id="map"></div>
    <button id="dark-mode-toggle" class="toggle-btn">Toggle Dark Mode</button>
    <div id="unmapped">
        <h3>Unmapped Sightings</h3>
        <ul id="unmapped-list"></ul>
    </div>
    <footer>
        <p class="copyright">Copyright © 2025 blurryreport.com</p>
        <div class="hit-counter" data-hit-counter data-key="site" role="status">
          <span class="hit-counter__label">Blurry Count:</span>
          <span class="hit-counter__digits" data-hit-counter-digits aria-hidden="true">-------</span>
          <span class="hit-counter__sr">loading</span>
        </div>
        <nav class="links" aria-label="Footer navigation">
          <a href="../../pages/about.html" class="link" style="color: burlywood;">About</a>
          <a href="../../pages/contact.html" class="link" style="color: burlywood;">Contact</a>
        </nav>
        <p class="copyright">Reports sourced from <a href="https://nuforc.org/" style="color: burlywood;">nuforc.org</a></p>
      </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="./main.js"></script>
    <script src="../../js/hit-counter.js" defer></script>
</body>
</html>
