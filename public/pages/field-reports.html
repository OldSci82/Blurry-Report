    <script>
    (function () {
      function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
      var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      function when(r) {
        var out = '', dm = String(r.date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/), tm = String(r.time || '').match(/^(\d{1,2}):(\d{2})$/);
        if (dm) out = MON[parseInt(dm[2], 10) - 1] + ' ' + parseInt(dm[3], 10) + ', ' + dm[1]; else if (r.date) out = String(r.date);
        if (tm) { var hh = parseInt(tm[1], 10); out += (out ? ' \u00b7 ' : '') + ((hh % 12) || 12) + ':' + tm[2] + ' ' + (hh < 12 ? 'AM' : 'PM'); } else if (r.time) out += (out ? ' \u00b7 ' : '') + r.time;
        return out;
      }
      function sortKey(r) { var t = String(r.time || '').match(/^(\d{1,2}):(\d{2})$/); return String(r.date || '') + 'T' + (t ? ('0' + t[1]).slice(-2) + ':' + t[2] : '00:00'); }
      function safeUrl(u) { u = String(u || '').trim(); if (!/^https?:\/\//i.test(u)) return ''; try { var x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; } catch (e) { return ''; } }
      function card(r) {
        var first = String(r.name || '').trim().split(/\s+/)[0] || 'Anonymous';
        var where = [r.city, r.state].filter(Boolean).join(', ');
        var m = safeUrl(r.media);
        var v = /^https:\/\/(x|twitter)\.com\/TheBlurryReport\//i.test(r.video||'') ? safeUrl(r.video) : '';
        return '<article class="report-card"><div class="meta">' + esc(first) + (where ? ' &middot; ' + esc(where) : '') + (when(r) ? ' &middot; ' + esc(when(r)) : '') + '</div><p>' + esc(r.description) + '</p>' +
          (m ? '<a class="media-link" href="' + esc(m) + '" target="_blank" rel="noopener nofollow ugc">View photo/video (external link)</a>' : '') +
          (v ? '<a class="media-link" href="' + esc(v) + '" target="_blank" rel="noopener">Watch the Blurry Report video on X</a>' : '') + '</article>';
      }
      function load(limit, emptyMsg) {
        var list = document.getElementById('report-list');
        fetch('../news/reports.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (data) {
          var items = (Array.isArray(data) ? data : []).filter(function (r) { return r && r.approved !== false; });
          items.sort(function (a, b) { var ka = sortKey(a), kb = sortKey(b); return ka < kb ? 1 : ka > kb ? -1 : 0; });
          if (limit) items = items.slice(0, limit);
          if (!items.length) { list.innerHTML = '<p class="empty">' + emptyMsg + '</p>'; return; }
          list.innerHTML = items.map(card).join('');
        }).catch(function () { list.innerHTML = '<p class="empty">' + emptyMsg + '</p>'; });
      }
      load(0, 'No field reports yet. Seen something? Be the first to file one.');
    })();
    </script>
