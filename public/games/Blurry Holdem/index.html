    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "Blurry Holdem",
  "url": "https://blurryreport.com/public/games/Blurry%20Holdem/index.html",
  "description": "Free Texas Hold'em in your browser against cryptid regulars like Goliath, Mothman and a Man in Black. A fan-made cryptid poker night from The Blurry Report.",
  "image": "https://blurryreport.com/public/images/game-cover-holdem.png",
  "genre": [
    "Card game",
    "Poker"
  ],
  "gamePlatform": "Web browser",
  "applicationCategory": "GameApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "publisher": {

  },

    <link rel="stylesheet" href="style.css">
<script data-goatcounter="https://blurryreport.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <!-- Stage + docked controls; status banner is footer below -->
    <div id="game-stage-viewport">
        <div id="game-stage-shell">
            <div id="game-stage">
                <div id="game-container">
                    <div id="table">
                        <div id="community-cards"></div>

                        <!-- Top NPC seat -->
                        <div class="player-area player-top">
                            <img src="images/npcs/goliath.png" alt="Goliath" class="player-image">
                            <div class="player-info">
                                <span class="player-name">Goliath</span>
                                <span class="player-chips">$100</span>
                            </div>
                            <div class="player-hand-display"></div>
                        </div>

                        <!-- Left NPC seat -->
                        <div class="player-area player-left">
                            <img src="images/npcs/agent.png" alt="Man in Black" class="player-image">
                            <div class="player-info">
                                <span class="player-name">Man in Black</span>
                                <span class="player-chips">$100</span>
                            </div>
                            <div class="player-hand-display"></div>
                        </div>

                        <!-- Right NPC seat -->
                        <div class="player-area player-right seat-mothman">
                            <img src="images/npcs/mothman.png" alt="Mothman" class="player-image npc-wide">
                            <div class="player-info">
                                <span class="player-name">Mothman</span>
                                <span class="player-chips">$100</span>
                            </div>
                            <div class="player-hand-display"></div>
                        </div>

                        <!-- Bottom: You -->
                        <div class="player-area player-bottom player-human-area">
                            <div class="player-hand-display"></div>
                            <img src="images/players/player1.png" alt="You" class="player-image player-human">
                            <div class="player-info">
                                <span class="player-name">You</span>
                                <span class="player-chips">$100</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls docked directly under the scaled stage at native size -->
        <div id="action-area">
            <div id="player-options" class="hidden">
                <div id="bet-live-info">
                    <span id="call-amount-label"></span>
                    <span id="raise-to-label"></span>
                    <span id="allin-label" class="hidden"></span>
                </div>
                <div class="bet-slider-row">
                    <label id="bet-slider-label" for="bet-slider">Raise to (total this round)</label>
                    <input type="range" id="bet-slider" min="0" max="100" value="0">
                    <span id="bet-amount">$0</span>
                </div>
                <div class="action-buttons">
                    <button id="fold-btn">Fold</button>
                    <button id="check-call-btn">Check / Call</button>
                    <button id="bet-raise-btn">Bet / Raise</button>
                </div>
            </div>
            <div id="player-select">
                <div class="player-select-label">Your look</div>
                <div class="player-select-options" role="group" aria-label="Choose player skin">
                    <button type="button" class="skin-btn selected" data-skin="player1" title="Skin 1">
                        <img src="images/players/player1.png" alt="Skin 1">
                    </button>
                    <button type="button" class="skin-btn" data-skin="player2" title="Skin 2">
                        <img src="images/players/player2.png" alt="Skin 2">
                    </button>
                    <button type="button" class="skin-btn" data-skin="player3" title="Skin 3">
                        <img src="images/players/player3.png" alt="Skin 3">
                    </button>
                    <button type="button" class="skin-btn" data-skin="player4" title="Skin 4">
                        <img src="images/players/player4.png" alt="Skin 4">
                    </button>
                </div>
            </div>
            <button id="start-game-btn">Start Game</button>
            <button id="next-round-btn" class="hidden">Next Round</button>
        </div>
    </div>

    <!-- Status/info strip at absolute bottom (under controls) -->
    <div id="status-banner">Pot ($0): Welcome to Blurry Hold'em! Pick a look and click 'Start Game'.</div>

    <script src="main.js"></script>
</body>
</html>
