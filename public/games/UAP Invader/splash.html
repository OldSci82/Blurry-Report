    <style>
        body {
            margin: 0;

        #cover {
            max-width: 80%;
            height: auto;
            border: 4px solid #f0f;
            box-shadow: 0 0 20px #f0f;
        }
        #fighters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .fighter {
            width: 60px;
            height: 30px;
            border: 2px solid #0ff;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .fighter.selected {
            border-color: #f00;
            box-shadow: 0 0 10px #f00;
        }
        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            padding: 10px 20px;

            color: #0ff;

<body>
    <div class="container">
        <img id="cover" src="images/game-cover.png" alt="UAP Invaders cover art" width="500" height="500">
        <h3>Select Your Fighter</h3>
        <div id="fighters">
            <img class="fighter" src="images/space-fighter1.png" alt="Space fighter 1" data-fighter="space-fighter1.png">
            <img class="fighter" src="images/space-fighter2.png" alt="Space fighter 2" data-fighter="space-fighter2.png">
            <img class="fighter" src="images/space-fighter3.png" alt="Space fighter 3" data-fighter="space-fighter3.png">
            <img class="fighter" src="images/space-fighter4.png" alt="Space fighter 4" data-fighter="space-fighter4.png">
            <img class="fighter" src="images/space-fighter5.png" alt="Space fighter 5" data-fighter="space-fighter5.png">
        </div>
        <button onclick="goBack()">Back</button>
        <button onclick="playGame()">Play</button>
    </div>
    <script>
        let selectedFighter = null;
        const fighters = document.querySelectorAll('.fighter');

        fighters.forEach(fighter => {
            fighter.addEventListener('click', () => {
                fighters.forEach(f => f.classList.remove('selected'));
                fighter.classList.add('selected');
                selectedFighter = fighter.dataset.fighter;
                localStorage.setItem('selectedFighter', selectedFighter);
            });
        });

        function goBack() {
            window.location.href = '../../pages/games.html';
        }

        function playGame() {
            if (!selectedFighter) {
                alert('Please select a fighter!');
                return;
            }
            if (window.innerWidth < 600) {
                window.location.href = 'Mobile/game.html';
            } else {
                window.location.href = 'Desktop/game.html';
            }
        }
    </script>
</body>
