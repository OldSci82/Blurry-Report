<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blurry Map</title>
    <link rel="icon" type="image/png" href="../../images/BR_favicon.png" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/hit-counter.css">
    <link rel="stylesheet" href="../../styles/app-footer.css">
</head>
<body>
    <header style="margin-bottom: 20px; display: flex; justify-content: center; font-size: xx-large;">
        <a href="../../../index.html" class="homeLink" aria-label="The Blurry Report Home">
          <h1>THE BLURRY REPORT</h1>
        </a>
      </header>
    <!-- Map + overlays share one positioned wrapper so they stay on the map -->
    <main id="map-wrap" class="map-wrap">
        <div id="map"></div>
        <div id="map-controls" class="map-controls">
            <button id="dark-mode-toggle" class="toggle-btn">Toggle Dark Mode</button>
        </div>
        <div id="unmapped">
            <h3>Unmapped Sightings</h3>
            <ul id="unmapped-list"></ul>
        </div>
    </main>
    <footer class="site-footer">
        <p class="copyright">Copyright © 2025 blurryreport.com</p>
        <div class="hit-counter" data-hit-counter data-key="site" role="status">
          <span class="hit-counter__label">Blurry Count:</span>
          <span class="hit-counter__digits" data-hit-counter-digits aria-hidden="true">-------</span>
          <span class="hit-counter__sr">loading</span>
        </div>
        <nav class="links" aria-label="Footer navigation">
          <a href="https://www.facebook.com/profile.php?id=61594529826160" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
          <a href="https://x.com/TheBlurryReport" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
          <a href="../../pages/about.html" class="link">About</a>
          <a href="../../pages/contact.html" class="link">Contact</a>
        </nav>
        <p class="footer-note">Reports sourced from <a href="https://nuforc.org/" target="_blank" rel="noopener noreferrer">nuforc.org</a></p>
      </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="./main.js"></script>
    <script src="../../js/hit-counter.js" defer></script>
</body>
</html>
